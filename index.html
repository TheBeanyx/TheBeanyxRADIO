<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <title>TheBeanyx Radio 24/7</title>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <style>
        body { background: #000; color: #0f0; font-family: 'Courier New', monospace; text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .box { border: 2px solid #0f0; padding: 30px; background: #050505; }
        button { padding: 15px 30px; background: #0f0; color: #000; border: none; font-weight: bold; cursor: pointer; font-size: 1.2rem; }
        button:hover { background: #fff; }
        #trackTitle { margin: 20px 0; min-height: 1.5em; color: white; }
    </style>
</head>
<body>

    <div class="box">
        <h1>THE BEANYX RADIO</h1>
        <div id="trackTitle">RENDSZER ONLINE</div>
        <button id="startBtn">ADÁS HALLGATÁSA</button>
    </div>

    <audio id="player" preload="auto"></audio>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBLZVnNY-HdYw7vpSfF6ewJHLru2l6e9WE",
            databaseURL: "https://thebeanyxradio-default-rtdb.europe-west1.firebasedatabase.app"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const playlist = [
            "Black Halo Protocol (1).mp3", "Black Halo Protocol (2).mp3",
            "Demon Season (1).mp3", "Demon Season.mp3",
            "Dust On The Sunday Sun (1).mp3", "Dust On The Sunday Sun.mp3",
            "Fractured Tongues, Broken Amps (1).mp3", "Fractured Tongues, Broken Amps.mp3",
            "Golden Afternoon Switch (1).mp3", "Golden Afternoon Switch.mp3",
            "Halfway To The Horizon (1).mp3", "Halfway To The Horizon.mp3",
            "Rise Like Thunder (1).mp3", "Rise Like Thunder.mp3",
            "Run The Gauntlet (1).mp3", "Run The Gauntlet.mp3",
            "Side of the Sun (1).mp3", "Side of the Sun.mp3",
            "Sun On My Sneakers (1).mp3", "Sun On My Sneakers.mp3",
            "Velvet Afterglow (1).mp3", "Velvet Afterglow.mp3"
        ];

        const player = document.getElementById('player');
        const title = document.getElementById('trackTitle');
        const btn = document.getElementById('startBtn');

        async function startRadio() {
            title.innerText = "SZINKRONIZÁLÁS...";
            const snap = await db.ref('radioState/playlistStartedAt').get();
            const startTime = snap.val();
            
            let totalElapsed = (Date.now() - startTime) / 1000;
            playCurrent(0, totalElapsed);
        }

        function playCurrent(index, elapsed) {
            if (index >= playlist.length) {
                // Ha a végére értünk, kezdjük újra a számolást (Loop)
                startRadio();
                return;
            }

            const trackName = playlist[index];
            player.src = encodeURIComponent(trackName);
            player.load(); // Kényszerített újratöltés

            // Megvárjuk, amíg a böngésző megmondja, milyen hosszú a fájl
            player.onloadedmetadata = () => {
                const duration = player.duration;
                if (elapsed < duration) {
                    player.currentTime = elapsed;
                    player.play().catch(e => {
                        console.error("Lejátszási hiba:", e);
                        title.innerText = "KATTINTS MÉG EGYSZER!";
                    });
                    title.innerText = "MOST SZÓL: " + trackName;
                    
                    player.onended = () => {
                        playCurrent((index + 1) % playlist.length, 0);
                    };
                } else {
                    playCurrent(index + 1, elapsed - duration);
                }
            };

            player.onerror = () => {
                console.warn("Fájl nem található, ugrom: " + trackName);
                playCurrent(index + 1, elapsed);
            };
        }

        btn.onclick = () => {
            startRadio();
            btn.style.display = 'none';
        };

        // ADMIN: resetTime() a konzolba az indításhoz
        window.resetTime = () => {
            db.ref('radioState').set({ playlistStartedAt: Date.now() });
            location.reload();
        };
    </script>
</body>
</html>
