<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TheBeanyxRADIO | STUDIO CONTROL</title>
    <link rel="icon" type="image/png" href="logo.png">
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-auth-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root { --neon: #00f2ff; --purple: #7000ff; --dark: #08080a; --panel: rgba(25, 25, 30, 0.98); }
        body { 
            margin: 0; background: var(--dark); color: #fff; font-family: 'Rajdhani', sans-serif;
            height: 100vh; display: flex; flex-direction: column; overflow: hidden;
        }

        header { 
            height: 50px; background: #000; display: flex; align-items: center; 
            justify-content: space-between; padding: 0 20px; border-bottom: 2px solid var(--purple);
        }

        main { 
            display: grid; grid-template-columns: 300px 1fr 300px; gap: 10px; 
            padding: 10px; flex: 1; overflow: hidden; 
        }

        .panel { 
            background: var(--panel); border: 1px solid rgba(255,255,255,0.1); 
            border-radius: 12px; display: flex; flex-direction: column; padding: 15px; overflow: hidden;
        }

        /* PLAYLIST CONTROLS */
        .tab-container { display: flex; gap: 5px; margin-bottom: 10px; }
        .tab { 
            flex: 1; padding: 5px; font-size: 0.7rem; background: #1a1a20; border: 1px solid #333; 
            color: #888; cursor: pointer; text-align: center; font-family: 'Orbitron';
        }
        .tab.active { background: var(--purple); color: #fff; border-color: var(--purple); }

        .scroll-list { overflow-y: auto; flex: 1; }
        .track-item {
            padding: 8px; margin-bottom: 4px; background: rgba(255,255,255,0.03);
            border-radius: 4px; cursor: pointer; font-size: 0.8rem; display: flex; justify-content: space-between; align-items: center;
        }
        .track-item:hover { background: rgba(0,242,255,0.1); }
        .track-item.active { border-left: 3px solid var(--neon); background: rgba(0,242,255,0.15); color: var(--neon); }
        .add-btn { color: var(--neon); font-weight: bold; padding: 0 5px; }

        /* MIXER */
        .mixer-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; height: 100%; }
        .channel { background: rgba(0,0,0,0.4); border-radius: 8px; padding: 10px; display: flex; flex-direction: column; align-items: center; }
        
        .fader-v { appearance: none; width: 120px; height: 4px; background: #111; transform: rotate(-90deg); margin: 60px 0; }
        .fader-v::-webkit-slider-thumb { appearance: none; width: 20px; height: 40px; background: #555; border: 1px solid #fff; cursor: pointer; }

        /* ANALYZER DUMMY */
        .analyzer { display: flex; align-items: flex-end; gap: 2px; height: 50px; margin-bottom: 15px; }
        .bar { flex: 1; background: var(--neon); min-height: 2px; transition: 0.1s; }

        .btn-action { width: 100%; padding: 10px; margin-top: 5px; border: none; border-radius: 4px; font-family: 'Orbitron'; cursor: pointer; }
        .btn-purple { background: var(--purple); color: #fff; }
        .btn-clear { background: #444; color: #fff; font-size: 0.6rem; }
    </style>
</head>
<body>

<header>
    <div style="display:flex; align-items:center; gap:10px;">
        <img src="logo.png" height="30">
        <span style="font-family:'Orbitron';">Beanyx<span style="color:var(--purple)">STUDIO</span></span>
    </div>
    <div id="statusTag" style="color: var(--neon); font-size: 0.8rem; font-family: 'Orbitron';">● ADÁSBAN</div>
</header>

<main>
    <section class="panel">
        <div class="tab-container">
            <div class="tab active">KÖNYVTÁR</div>
        </div>
        <div class="scroll-list" id="libraryList"></div>
    </section>

    <section class="panel">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <h2 style="font-family:'Orbitron'; font-size:0.8rem; color:var(--purple);">AKTÍV LEJÁTSZÁSI LISTA</h2>
            <button class="btn-clear" onclick="clearCustomPlaylist()">LISTA ÜRÍTÉSE</button>
        </div>
        <div class="scroll-list" id="customPlaylist" style="max-height: 200px; background: rgba(0,0,0,0.2); margin-bottom: 15px;"></div>
        
        <div class="mixer-grid">
            <div class="channel"><i>MUSIC</i><input type="range" class="fader-v"></div>
            <div class="channel"><i>AUTO</i><input type="range" class="fader-v"></div>
            <div class="channel" style="border:1px solid var(--neon)"><i>MASTER</i><input type="range" class="fader-v"></div>
        </div>
    </section>

    <section class="panel">
        <div class="analyzer" id="bars"></div>
        <div style="font-size: 0.7rem; opacity: 0.5;">MOST SZÓL:</div>
        <div id="nowPlaying" style="color: var(--neon); font-weight: bold; margin-bottom: 20px;">---</div>
        
        <button class="btn-action btn-purple" onclick="togglePlayMode()" id="modeStatus">MÓD: KÖNYVTÁR</button>
        <p style="font-size: 0.6rem; opacity: 0.7;">* Könyvtár mód: Az összes zene szól.<br>* Playlist mód: Csak a fenti lista szól.</p>
        
        <div style="margin-top:auto">
            <button class="btn-action" style="background:#222; color:#fff;" onclick="auth.signOut()">KILÉPÉS</button>
        </div>
    </section>
</main>

<script>
    const firebaseConfig = { 
        apiKey: "AIzaSyBLZVnNY-HdYw7vpSfF6ewJHLru2l6e9WE", 
        databaseURL: "https://thebeanyxradio-default-rtdb.europe-west1.firebasedatabase.app",
        authDomain: "thebeanyxradio.firebaseapp.com" 
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const auth = firebase.auth();

    const allSongs = ["songs/Aszfalttrón (2).mp3", "songs/Black Halo Protocol (1).mp3", "songs/Black Halo Protocol (2).mp3", "songs/Csúcsra Járok (1).mp3", "songs/Demon Season (1).mp3", "songs/Demon Season.mp3", "songs/Dust On The Sunday Sun (1).mp3", "songs/Dust On The Sunday Sun.mp3", "songs/Fractured Tongues, Broken Amps (1).mp3", "songs/Fractured Tongues, Broken Amps.mp3", "songs/Fénysebesség Szerelem (1).mp3", "songs/Gelato Dugómentes (1).mp3", "songs/Golden Afternoon Switch (1).mp3", "songs/Golden Afternoon Switch.mp3", "songs/Halfway To The Horizon (1).mp3", "songs/Halfway To The Horizon.mp3", "songs/Kiállok Érted (1).mp3", "songs/Kártyák Az Asztalon (1).mp3", "songs/Közös Emlékezés.mp3", "songs/La Dolce Vita (1).mp3", "songs/La Dolce Vita.mp3", "songs/Maradj Még Egy Percet (1).mp3", "songs/Maradnék Benned (1).mp3", "songs/Neonfényes Álmok (1).mp3", "songs/Nyári Fényben Táncolunk (1).mp3", "songs/Rise Like Thunder (1).mp3", "songs/Rise Like Thunder.mp3", "songs/Run The Gauntlet (1).mp3", "songs/Run The Gauntlet.mp3", "songs/Régi Fűzfa Árnyékában (1).mp3", "songs/Side of the Sun (1).mp3", "songs/Side of the Sun.mp3", "songs/Sun On My Sneakers (1).mp3", "songs/Sun On My Sneakers.mp3", "songs/Sötétből jövök.mp3", "songs/Velvet Afterglow (1).mp3", "songs/Velvet Afterglow.mp3", "songs/Üsd A Ritmust (2).mp3"];

    let customList = [];
    let isPlaylistMode = false;

    // Library feltöltése
    const libDiv = document.getElementById('libraryList');
    allSongs.forEach((s, i) => {
        const d = document.createElement('div');
        d.className = 'track-item';
        d.innerHTML = `<span>${s.split('/').pop()}</span> <span class="add-btn" onclick="addToCustom(${i})">+</span>`;
        d.onclick = (e) => { if(e.target.className != 'add-btn') forcePlay(i); };
        libDiv.appendChild(d);
    });

    function addToCustom(index) {
        if(!customList.includes(index)) {
            customList.push(index);
            updateCustomUI();
            db.ref('radioState/customList').set(customList);
        }
    }

    function clearCustomPlaylist() {
        customList = [];
        updateCustomUI();
        db.ref('radioState/customList').set(null);
    }

    function updateCustomUI() {
        const custDiv = document.getElementById('customPlaylist');
        custDiv.innerHTML = '';
        customList.forEach((songIndex, pos) => {
            const d = document.createElement('div');
            d.className = 'track-item';
            d.innerHTML = `<span>${allSongs[songIndex].split('/').pop()}</span>`;
            d.onclick = () => forcePlay(songIndex);
            custDiv.appendChild(d);
        });
    }

    function forcePlay(index) {
        db.ref('radioState').update({
            currentTrackIndex: index,
            playlistStartedAt: Date.now()
        });
    }

    function togglePlayMode() {
        isPlaylistMode = !isPlaylistMode;
        db.ref('radioState/isPlaylistMode').set(isPlaylistMode);
        document.getElementById('modeStatus').innerText = isPlaylistMode ? "MÓD: PLAYLIST" : "MÓD: KÖNYVTÁR";
    }

    // Szinkronizáció
    db.ref('radioState').on('value', snap => {
        const data = snap.val();
        if(!data) return;
        if(data.customList) { customList = data.customList; updateCustomUI(); }
        isPlaylistMode = data.isPlaylistMode || false;
        document.getElementById('modeStatus').innerText = isPlaylistMode ? "MÓD: PLAYLIST" : "MÓD: KÖNYVTÁR";
        document.getElementById('nowPlaying').innerText = allSongs[data.currentTrackIndex].split('/').pop();
    });

    // Kamu analizátor animáció
    const barsContainer = document.getElementById('bars');
    for(let i=0; i<20; i++) {
        const bar = document.createElement('div');
        bar.className = 'bar';
        barsContainer.appendChild(bar);
    }
    setInterval(() => {
        document.querySelectorAll('.bar').forEach(b => {
            b.style.height = Math.random() * 50 + 'px';
        });
    }, 150);


</script>
</body>
</html>
