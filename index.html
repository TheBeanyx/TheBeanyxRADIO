<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TheBeanyxRADIO - Élőadás</title>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-auth-compat.js"></script>
    
    <script src="list.songs.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #00f2ff; --secondary: #7000ff; --bg: #050505; --panel: rgba(255, 255, 255, 0.05); --text: #fff;
        }
        [data-theme="light"] {
            --primary: #007bff; --secondary: #6610f2; --bg: #f8f9fa; --panel: rgba(0, 0, 0, 0.05); --text: #212529;
        }

        body {
            margin: 0; background: var(--bg); color: var(--text);
            font-family: 'Rajdhani', sans-serif; overflow-x: hidden;
            display: flex; flex-direction: column; align-items: center; min-height: 100vh;
            transition: 0.5s;
        }

        nav { width: 100%; padding: 20px; display: flex; justify-content: flex-end; gap: 15px; z-index: 100; box-sizing: border-box; }
        .glass-card {
            background: var(--panel); backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 30px;
            padding: 40px; width: 90%; max-width: 850px; text-align: center;
            box-shadow: 0 25px 50px rgba(0,0,0,0.3); margin-bottom: 50px;
        }

        .time-display { font-family: 'Orbitron', sans-serif; font-size: 4rem; font-weight: 700; margin: 10px 0; text-shadow: 0 0 15px var(--primary); }
        
        .weather-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin: 25px 0; }
        .w-card { background: rgba(0,0,0,0.2); padding: 15px; border-radius: 15px; border-bottom: 3px solid var(--primary); }
        .w-card i { display: block; font-size: 0.7rem; opacity: 0.6; text-transform: uppercase; }
        .w-card b { font-size: 1.2rem; color: var(--primary); display: block; }
        .w-card span { font-size: 0.8rem; }

        .btn {
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            border: none; color: white; padding: 12px 30px; border-radius: 50px;
            font-family: 'Orbitron', sans-serif; cursor: pointer; transition: 0.3s;
        }
        .btn:hover { transform: translateY(-3px); box-shadow: 0 5px 15px var(--primary); }
        
        .btn-google { background: #db4437; margin-top: 10px; }
        .btn-logout { background: #444; }

        input, textarea {
            background: rgba(0,0,0,0.2); border: 1px solid var(--primary);
            color: white; padding: 10px; border-radius: 10px; width: 100%; box-sizing: border-box; margin: 10px 0;
        }

        .admin-scroll { max-height: 300px; overflow-y: auto; text-align: left; margin: 20px 0; padding: 10px; background: rgba(0,0,0,0.2); border-radius: 10px; }
        .track-item { padding: 10px; border-bottom: 1px solid rgba(255,255,255,0.05); cursor: pointer; }
        .track-item:hover { background: var(--primary); color: #000; }

        .hidden { display: none !important; }
        #aiStatus { color: #f2ff00; height: 20px; font-weight: bold; margin-bottom: 10px; }
    </style>
</head>
<body data-theme="dark">

    <nav>
        <button class="btn" onclick="toggleTheme()">🌓 TÉMA</button>
        <button class="btn" id="adminBtn" onclick="showLogin()">🔐 ADMIN</button>
        <button class="btn btn-logout hidden" id="logoutBtn" onclick="handleLogout()">KILÉPÉS</button>
    </nav>

    <div class="glass-card" id="mainUI">
        <h1 style="font-family: 'Orbitron'; letter-spacing: 4px;">TheBeanyxRADIO - Élőadás</h1>
        <div id="aiStatus"></div>
        <div class="time-display" id="clock">00:00:00</div>
        
        <div class="weather-grid" id="weatherGrid">
            <div class="w-card"><i>Budapest</i>🌡️<b id="t-bp">--°C</b><span id="s-bp">--</span></div>
            <div class="w-card"><i>Miskolc (É)</i>🌡️<b id="t-miskolc">--°C</b><span id="s-miskolc">--</span></div>
            <div class="w-card"><i>Szeged (D)</i>🌡️<b id="t-szeged">--°C</b><span id="s-szeged">--</span></div>
            <div class="w-card"><i>Debrecen (K)</i>🌡️<b id="t-debrecen">--°C</b><span id="s-debrecen">--</span></div>
            <div class="w-card"><i>Pécs (NY)</i>🌡️<b id="t-pecs">--°C</b><span id="s-pecs">--</span></div>
        </div>

        <div style="background: rgba(0,0,0,0.3); padding: 20px; border-radius: 20px; border-left: 5px solid var(--secondary);">
            <i style="font-size: 0.8rem; opacity: 0.5;">Éppen szól:</i>
            <div id="trackTitle" style="font-size: 1.4rem; font-weight: bold;">Rendszer betöltése...</div>
        </div>
        <br>
        <button id="startBtn" class="btn" style="padding: 20px 60px; font-size: 1.2rem;">Adás hallgatása</button>
    </div>

    <div id="loginUI" class="glass-card hidden">
        <h2>Adminisztrátori Belépés</h2>
        <input type="email" id="email" placeholder="Email cím">
        <input type="password" id="pass" placeholder="Jelszó">
        <button class="btn" style="width: 100%;" onclick="loginWithEmail()">BELÉPÉS EMAIL-LEL</button>
        <button class="btn btn-google" style="width: 100%;" onclick="loginWithGoogle()">BELÉPÉS GOOGLE-LAL</button>
        <br><br>
        <button class="btn" style="background:#444; width: 100%;" onclick="hideAll()">VISSZA</button>
    </div>

    <div id="adminUI" class="glass-card hidden">
        <h2>BROADCAST CONSOLE</h2>
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 20px;">
            <div>
                <h3>Lejátszási lista</h3>
                <div class="admin-scroll" id="adminPlaylist"></div>
            </div>
            <div>
                <h3>Hirtelen bemondás</h3>
                <textarea id="breakingText" rows="4" placeholder="Írd ide a rendkívüli bemondás szövegét..."></textarea>
                <button class="btn" style="width:100%; background: #c00;" onclick="sendEmergency()">AZONNALI BEMONDÁS</button>
            </div>
        </div>
    </div>

    <audio id="player"></audio>

    <script>
        const firebaseConfig = { 
            apiKey: "AIzaSyBLZVnNY-HdYw7vpSfF6ewJHLru2l6e9WE", 
            databaseURL: "https://thebeanyxradio-default-rtdb.europe-west1.firebasedatabase.app",
            authDomain: "thebeanyxradio.firebaseapp.com" 
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const auth = firebase.auth();

        auth.onAuthStateChanged(user => {
            if (user) {
                document.getElementById('adminBtn').classList.add('hidden');
                document.getElementById('logoutBtn').classList.remove('hidden');
                if (!document.getElementById('loginUI').classList.contains('hidden')) {
                    showAdminPanel();
                }
            } else {
                document.getElementById('adminBtn').classList.remove('hidden');
                document.getElementById('logoutBtn').classList.add('hidden');
                hideAll();
            }
        });

        function loginWithEmail() {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('pass').value;
            auth.signInWithEmailAndPassword(email, pass).catch(err => alert("Hiba: " + err.message));
        }

        function loginWithGoogle() {
            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(provider).catch(err => alert("Hiba: " + err.message));
        }

        function handleLogout() {
            auth.signOut();
        }

        function showAdminPanel() {
            document.getElementById('mainUI').classList.add('hidden');
            document.getElementById('loginUI').classList.add('hidden');
            document.getElementById('adminUI').classList.remove('hidden');
        }

        function showLogin() {
            if (auth.currentUser) {
                showAdminPanel();
            } else {
                document.getElementById('mainUI').classList.add('hidden');
                document.getElementById('loginUI').classList.remove('hidden');
            }
        }

        function hideAll() {
            document.getElementById('loginUI').classList.add('hidden');
            document.getElementById('adminUI').classList.add('hidden');
            document.getElementById('mainUI').classList.remove('hidden');
        }

        const audio = document.getElementById('player');
        let cities = {
            bp: { n: "Budapest", lat: 47.49, lon: 19.04, t: 0, s: "", w: 0 },
            miskolc: { n: "Miskolc", lat: 48.10, lon: 20.78, t: 0, s: "", w: 0 },
            szeged: { n: "Szeged", lat: 46.25, lon: 20.14, t: 0, s: "", w: 0 },
            debrecen: { n: "Debrecen", lat: 47.53, lon: 21.62, t: 0, s: "", w: 0 },
            pecs: { n: "Pécs", lat: 46.07, lon: 18.23, t: 0, s: "", w: 0 }
        };

        let isSpeaking = false;
        let isLive = false;
        const wCodes = { 0: "Tiszta égbolt", 1: "Párás", 2: "Részben felhős", 3: "Borult", 45: "Ködös", 51: "Szitálás", 61: "Esős", 71: "Havas", 95: "Zivatar" };

        async function updateWeather() {
            for (let k in cities) {
                try {
                    const r = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${cities[k].lat}&longitude=${cities[k].lon}&current_weather=true`);
                    const d = await r.json();
                    cities[k].t = Math.round(d.current_weather.temperature);
                    cities[k].w = Math.round(d.current_weather.windspeed);
                    cities[k].s = wCodes[d.current_weather.weathercode] || "Változékony";
                    document.getElementById(`t-${k}`).innerText = cities[k].t + "°C";
                    document.getElementById(`s-${k}`).innerText = `${cities[k].s} | ${cities[k].w} km/h`;
                } catch(e) {}
            }
        }
        updateWeather(); setInterval(updateWeather, 600000);

        function speak(text, isUrgent = false) {
            if (!isLive) return;
            isSpeaking = true;
            document.getElementById('aiStatus').innerText = isUrgent ? "🔴 RENDKÍVÜLI KÖZLEMÉNY..." : "🎙️ MŰSORVEZETŐ ADÁSBAN...";
            audio.volume = 0.1;
            const utter = new SpeechSynthesisUtterance(text);
            utter.lang = 'hu-HU'; utter.rate = 0.95;
            utter.onend = () => {
                isSpeaking = false;
                document.getElementById('aiStatus').innerText = "";
                audio.volume = 1;
                if(isUrgent) sync();
            };
            window.speechSynthesis.speak(utter);
        }

        function checkAnnounce() {
            const now = new Date();
            const time = now.toLocaleTimeString('hu-HU', {hour:'2-digit', minute:'2-digit'});
            const sec = now.getSeconds();
            const sched = ["07:00", "07:30", "08:00", "08:15", "08:30", "09:00", "09:30", "10:00", "10:15", "10:30", "11:00", "11:30", "12:00", "12:15", "12:30", "12:45", "13:00", "14:00", "15:00", "16:00", "16:30", "17:00", "17:30", "18:00", "19:00"];
            if (sched.includes(time) && sec === 0 && !isSpeaking) {
                const txt = `Üdvözlök mindenkit! ${time} van. Időjárás: Budapest ${cities.bp.t} fok, Pécs ${cities.pecs.t} fok, Szeged ${cities.szeged.t} fok. További jó szórakozást!`;
                speak(txt);
            }
        }
        setInterval(() => { document.getElementById('clock').innerText = new Date().toLocaleTimeString('hu-HU'); checkAnnounce(); }, 1000);

        async function sync() {
            if (isSpeaking || !isLive) return;
            const snap = await db.ref('radioState').get();
            const data = snap.val();
            if(!data) return;

            // Útvonal javítás: Biztosítjuk, hogy a fájl az index.html-hez képest elérhető
            let track = playlist[data.currentTrackIndex];
            if (!track.startsWith('songs/')) track = 'songs/' + track;
            
            const elapsed = (Date.now() - data.playlistStartedAt) / 1000;
            
            // Csak akkor váltunk forrást, ha tényleg változott a dal
            const currentSrc = audio.src.split('/').pop();
            const newSrc = track.split('/').pop();

            if (decodeURIComponent(currentSrc) !== newSrc) {
                audio.src = track;
                audio.load();
            }

            audio.onloadedmetadata = () => {
                if(elapsed < audio.duration) { 
                    audio.currentTime = elapsed; 
                    audio.play().catch(e => console.log("Lejátszási hiba:", e)); 
                    document.getElementById('trackTitle').innerText = track.split('/').pop().replace('.mp3','').toUpperCase(); 
                }
                else { 
                    if(auth.currentUser) db.ref('radioState').set({ 
                        currentTrackIndex: (data.currentTrackIndex + 1) % playlist.length, 
                        playlistStartedAt: Date.now() 
                    }); 
                }
            };
        }

        db.ref('radioState').on('value', sync);
        db.ref('emergency').on('value', (s) => { if(s.val()) { speak(s.val(), true); if(auth.currentUser) db.ref('emergency').set(null); } });

        document.getElementById('startBtn').onclick = () => { isLive = true; document.getElementById('startBtn').classList.add('hidden'); sync(); };

        const plist = document.getElementById('adminPlaylist');
        playlist.forEach((t, i) => {
            const d = document.createElement('div'); 
            d.className = 'track-item'; 
            d.innerText = t.split('/').pop();
            d.onclick = () => { if(auth.currentUser) db.ref('radioState').set({ currentTrackIndex: i, playlistStartedAt: Date.now() }); };
            plist.appendChild(d);
        });

        function sendEmergency() { const t = document.getElementById('breakingText').value; if(t && auth.currentUser) db.ref('emergency').set(t); }
        function toggleTheme() { const b = document.body; b.setAttribute('data-theme', b.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'); }
    </script>
</body>
</html>
