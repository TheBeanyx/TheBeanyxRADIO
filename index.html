<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <title>Webrádió</title>
</head>
<body>
    <h1>Élő Webrádió</h1>
    <audio id="radio" controls autoplay></audio>

    <script>
        const playlist = [
            "https://pelda.hu/zene1.mp3",
            "https://pelda.hu/zene2.mp3"
        ];
        
        let index = 0;
        const player = document.getElementById('radio');

        function playNext() {
            player.src = playlist[index];
            player.play();
            index = (index + 1) % playlist.length;
        }

        player.onended = playNext;
        playNext();
    </script>
</body>
</html>
