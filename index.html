<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TheBeanyxRADIO - Teszt Üzemmód</title>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-auth-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron&family=Rajdhani:wght@500&display=swap" rel="stylesheet">
    <style>
        body { background: #050505; color: white; font-family: 'Rajdhani', sans-serif; text-align: center; padding: 50px; }
        .card { background: rgba(255,255,255,0.05); padding: 30px; border-radius: 20px; border: 1px solid #00f2ff; }
        .btn { background: #00f2ff; color: black; border: none; padding: 15px 30px; border-radius: 50px; cursor: pointer; font-family: 'Orbitron'; font-weight: bold; }
        #debug { margin-top: 20px; font-size: 0.8rem; color: #aaa; border-top: 1px solid #333; padding-top: 10px; }
        .error { color: #ff4444; }
    </style>
</head>
<body>

    <div class="card">
        <h1 style="font-family: 'Orbitron'; color: #00f2ff;">TheBeanyxRADIO</h1>
        <div id="status">Állapot: Betöltés...</div>
        <h2 id="nowPlaying">Várakozás a szerverre...</h2>
        <br>
        <button id="startBtn" class="btn">ADÁS HALLGATÁSA</button>
        
        <div id="debug">
            <div>Firebase: <span id="f-status">Vár...</span></div>
            <div>Aktuális fájl: <span id="f-file">-</span></div>
        </div>
    </div>

    <audio id="player"></audio>

    <script>
        // --- KONFIGURÁCIÓ ---
        const playlist = [
            "songs/Aszfalttrón (2).mp3", "songs/Black Halo Protocol (1).mp3", "songs/Black Halo Protocol (2).mp3",
            "songs/Csúcsra Járok (1).mp3", "songs/Demon Season (1).mp3", "songs/Demon Season.mp3"
        ]; // Csak az első párat tettem ide tesztnek, bővítsd majd!

        const firebaseConfig = { 
            apiKey: "AIzaSyBLZVnNY-HdYw7vpSfF6ewJHLru2l6e9WE", 
            databaseURL: "https://thebeanyxradio-default-rtdb.europe-west1.firebasedatabase.app",
            authDomain: "thebeanyxradio.firebaseapp.com" 
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const audio = document.getElementById('player');
        let isLive = false;

        function log(msg, isError = false) {
            const s = document.getElementById('f-status');
            s.innerText = msg;
            if(isError) s.className = 'error';
        }

        // --- SZINKRONIZÁCIÓ ---
        db.ref('radioState').on('value', (snap) => {
            const data = snap.val();
            if(!data) {
                log("Hiba: Nincs adat az adatbázisban! (Adminnak el kell indítania)", true);
                return;
            }
            log("Szerver kapcsolat OK");

            const trackPath = playlist[data.currentTrackIndex];
            if(!trackPath) return;

            const elapsed = (Date.now() - data.playlistStartedAt) / 1000;
            document.getElementById('f-file').innerText = trackPath;
            
            // Ha még nem játszunk, vagy új dal jött
            if (isLive && (audio.paused || !audio.src.includes(encodeURIComponent(trackPath.split('/').pop())))) {
                audio.src = trackPath;
                audio.load();
                audio.onloadedmetadata = () => {
                    if(elapsed < audio.duration) {
                        audio.currentTime = elapsed;
                        audio.play().catch(e => log("Lejátszási hiba: " + e.message, true));
                        document.getElementById('nowPlaying').innerText = trackPath.replace('songs/', '').replace('.mp3', '').toUpperCase();
                    }
                };
            }
        });

        document.getElementById('startBtn').onclick = () => {
            isLive = true;
            document.getElementById('startBtn').innerText = "ONLINE";
            document.getElementById('startBtn').style.background = "#7000ff";
            document.getElementById('status').innerText = "Állapot: Kapcsolódva";
            // Kényszerített frissítés gombnyomáskor
            db.ref('radioState').get().then(snap => {
                if(!snap.exists()) log("Az adatbázis üres! Jelentkezz be Adminnak és válassz egy dalt!", true);
            });
        };
    </script>
</body>
</html>
