<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TheBeanyx Cloud Radio 24/7</title>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    
    <style>
        :root { --bg: #f4f4f4; --text: #333; --panel: #fff; --accent: #007bff; --border: #ddd; }
        [data-theme="dark"] { --bg: #0d0d0d; --text: #00ff00; --panel: #1a1a1a; --accent: #00ff00; --border: #00ff00; }

        body { background: var(--bg); color: var(--text); font-family: 'Courier New', monospace; transition: 0.5s; margin: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        
        nav { width: 100%; padding: 15px; display: flex; justify-content: flex-end; box-sizing: border-box; }
        .btn-ui { padding: 8px 15px; cursor: pointer; background: var(--accent); color: #000; border: none; font-weight: bold; border-radius: 4px; margin-left: 10px; }

        .container { width: 90%; max-width: 550px; background: var(--panel); margin: 20px; padding: 30px; border-radius: 10px; box-shadow: 0 0 20px rgba(0,0,0,0.3); text-align: center; border: 2px solid var(--border); }
        
        .info-bar { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 25px; border-bottom: 1px solid var(--border); padding-bottom: 15px; }
        #clock { font-size: 2.5em; font-weight: bold; grid-column: span 2; }
        
        #nowPlaying { font-size: 1.2em; margin: 25px 0; min-height: 2em; border: 1px dashed var(--border); padding: 15px; color: #fff; background: rgba(255,255,255,0.05); }
        
        .playlist-box { text-align: left; max-height: 250px; overflow-y: auto; margin-top: 20px; border: 1px solid var(--border); }
        .track { padding: 10px; cursor: pointer; border-bottom: 1px solid #333; font-size: 0.9em; transition: 0.2s; }
        .track:hover { background: var(--accent); color: #000; }

        .hidden { display: none !important; }
        input { padding: 12px; margin: 8px; border: 1px solid var(--accent); background: #222; color: #fff; width: 80%; }
        .theme-icon { cursor: pointer; font-size: 1.8em; }
    </style>
</head>
<body data-theme="dark">

    <nav>
        <div class="theme-icon" onclick="toggleTheme()">🌓</div>
        <button id="loginBtn" class="btn-ui">ADMIN</button>
    </nav>

    <div id="listenerPanel" class="container">
        <div class="info-bar">
            <div id="clock">00:00:00</div>
            <div id="dateText">Dátum...</div>
            <div id="weatherText">Időjárás...</div>
        </div>
        
        <div id="nowPlaying">NYOMJ A STARTRA AZ ADÁSHOZ</div>
        <button id="startBtn" class="btn-ui" style="padding: 20px 40px; font-size: 1.3em;">HALLGATÁS</button>
    </div>

    <div id="loginSection" class="container hidden">
        <h2>Rendszer Belépés</h2>
        <input type="text" id="userIn" placeholder="Felhasználó">
        <input type="password" id="passIn" placeholder="Jelszó">
        <br>
        <button class="btn-ui" onclick="doLogin()">BELÉPÉS</button>
        <button class="btn-ui" style="background: #555;" onclick="hideLogin()">MÉGSE</button>
    </div>

    <div id="adminPanel" class="container hidden">
        <h2>STÚDIÓ VEZÉRLÉS</h2>
        <p>Kattints egy dalra a kényszerített váltáshoz:</p>
        <div class="playlist-box" id="adminList"></div>
        <br>
        <button class="btn-ui" style="background: #aa0000; color: #fff;" onclick="logout()">KILÉPÉS</button>
    </div>

    <audio id="mainPlayer"></audio>

    <script>
        // --- FIREBASE KONFIGURÁCIÓ ---
        const firebaseConfig = {
            apiKey: "AIzaSyBLZVnNY-HdYw7vpSfF6ewJHLru2l6e9WE",
            databaseURL: "https://thebeanyxradio-default-rtdb.europe-west1.firebasedatabase.app"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const playlist = [
            "Black Halo Protocol (1).mp3", "Black Halo Protocol (2).mp3",
            "Demon Season (1).mp3", "Demon Season.mp3",
            "Dust On The Sunday Sun (1).mp3", "Dust On The Sunday Sun.mp3",
            "Fractured Tongues, Broken Amps (1).mp3", "Fractured Tongues, Broken Amps.mp3",
            "Golden Afternoon Switch (1).mp3", "Golden Afternoon Switch.mp3",
            "Halfway To The Horizon (1).mp3", "Halfway To The Horizon.mp3",
            "Rise Like Thunder (1).mp3", "Rise Like Thunder.mp3",
            "Run The Gauntlet (1).mp3", "Run The Gauntlet.mp3",
            "Side of the Sun (1).mp3", "Side of the Sun.mp3",
            "Sun On My Sneakers (1).mp3", "Sun On My Sneakers.mp3",
            "Velvet Afterglow (1).mp3", "Velvet Afterglow.mp3"
        ];

        const audio = document.getElementById('mainPlayer');
        let currentTemp = "kellemes";

        // --- IDŐJÁRÁS ÉS ÓRA ---
        function updateClock() {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString('hu-HU');
            document.getElementById('dateText').innerText = now.toLocaleDateString('hu-HU', {month:'long', day:'numeric'});
            
            // AI BEMONDÓ IDŐZÍTÉSE (10:30)
            if (now.getHours() === 10 && now.getMinutes() === 30 && now.getSeconds() === 0) {
                playAIReporter();
            }
        }
        setInterval(updateClock, 1000);

        async function fetchWeather() {
            try {
                const r = await fetch('https://api.open-meteo.com/v1/forecast?latitude=47.47&longitude=18.82&current_weather=true');
                const d = await r.json();
                const t = Math.round(d.current_weather.temperature);
                currentTemp = t + " fok";
                document.getElementById('weatherText').innerText = "🌡️ " + t + "°C";
            } catch(e) { document.getElementById('weatherText').innerText = "☀️ Napos"; }
        }
        fetchWeather();
        setInterval(fetchWeather, 600000);

        // --- AI BEMONDÓ ---
        function playAIReporter() {
            const now = new Date();
            const text = `Figyelem, időjárás jelentés! Délelőtt 10 óra 30 perc van. A hőmérséklet jelenleg ${currentTemp}. További jó rádiózást kíván a Beanyx AI.`;
            
            const msg = new SpeechSynthesisUtterance(text);
            msg.lang = 'hu-HU';
            msg.rate = 0.85;

            const oldVol = audio.volume;
            audio.volume = 0.15; // Lehalkít
            msg.onend = () => { audio.volume = oldVol; }; // Visszahangosít
            
            window.speechSynthesis.speak(msg);
        }

        // --- RÁDIÓ LOGIKA ---
        db.ref('radioState').on('value', (snap) => {
            const data = snap.val();
            if(!data) return;

            const track = playlist[data.currentTrackIndex];
            const elapsed = (Date.now() - data.playlistStartedAt) / 1000;

            audio.src = encodeURIComponent(track);
            audio.onloadeddata = () => {
                if (elapsed < audio.duration) {
                    audio.currentTime = elapsed;
                    audio.play().catch(() => { document.getElementById('nowPlaying').innerText = "NYOMJ A HALLGATÁSRA!"; });
                    document.getElementById('nowPlaying').innerText = "MOST SZÓL: " + track.replace('.mp3','');
                }
            };
        });

        document.getElementById('startBtn').onclick = () => {
            audio.play();
            document.getElementById('startBtn').classList.add('hidden');
        };

        audio.onended = () => {
            // Automata léptetés: csak egy kliensnél fusson le, hogy ne legyen káosz
            db.ref('radioState/currentTrackIndex').get().then(s => {
                let next = (s.val() + 1) % playlist.length;
                db.ref('radioState').update({ currentTrackIndex: next, playlistStartedAt: Date.now() });
            });
        };

        // --- ADMIN / UI ---
        function toggleTheme() {
            const b = document.body;
            b.setAttribute('data-theme', b.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
        }

        const alist = document.getElementById('adminList');
        playlist.forEach((t, i) => {
            let item = document.createElement('div');
            item.className = 'track';
            item.innerText = t;
            item.onclick = () => db.ref('radioState').set({ currentTrackIndex: i, playlistStartedAt: Date.now() });
            alist.appendChild(item);
        });

        document.getElementById('loginBtn').onclick = () => document.getElementById('loginSection').classList.remove('hidden');
        function hideLogin() { document.getElementById('loginSection').classList.add('hidden'); }
        
        function doLogin() {
            if(document.getElementById('userIn').value === "admin" && document.getElementById('passIn').value === "beanyx123") {
                document.getElementById('loginSection').classList.add('hidden');
                document.getElementById('adminPanel').classList.remove('hidden');
                document.getElementById('listenerPanel').classList.add('hidden');
            } else { alert("Helytelen!"); }
        }

        function logout() {
            document.getElementById('adminPanel').classList.add('hidden');
            document.getElementById('listenerPanel').classList.remove('hidden');
        }
    </script>
</body>
</html>
