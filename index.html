<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TheBeanyx Radio 24/7</title>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    
    <style>
        body { 
            background: #0f0f0f; 
            color: #00ff00; 
            font-family: 'Courier New', monospace; 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .container {
            border: 2px solid #00ff00;
            padding: 40px;
            background: rgba(0, 255, 0, 0.05);
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.2);
            text-align: center;
            max-width: 80%;
        }
        h1 { font-size: 2.5em; margin-bottom: 10px; letter-spacing: 5px; }
        #trackTitle { font-size: 1.2em; margin-bottom: 30px; color: #fff; }
        .btn {
            background: #00ff00;
            color: #000;
            border: none;
            padding: 15px 40px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
        }
        .btn:hover { background: #fff; box-shadow: 0 0 15px #fff; }
        .btn:disabled { background: #333; color: #666; cursor: default; box-shadow: none; }
        #status { margin-top: 15px; font-size: 0.8em; opacity: 0.6; }
    </style>
</head>
<body>

    <div class="container">
        <h1>THE BEANYX RADIO</h1>
        <p id="trackTitle">BECSATLAKOZÁSRA VÁR...</p>
        <button id="startBtn" class="btn">HALLGATÁS</button>
        <p id="status">0-24 AUTONÓM ADÁS</p>
    </div>

    <audio id="player" preload="auto"></audio>

    <script>
        // --- FIREBASE KONFIGURÁCIÓ ---
        const firebaseConfig = {
            apiKey: "AIzaSyBLZVnNY-HdYw7vpSfF6ewJHLru2l6e9WE",
            authDomain: "thebeanyxradio.firebaseapp.com",
            databaseURL: "https://thebeanyxradio-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "thebeanyxradio",
            storageBucket: "thebeanyxradio.firebasestorage.app",
            messagingSenderId: "492055957952",
            appId: "1:492055957952:web:5eece9153e7caf35df7825"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const player = document.getElementById('player');
        const title = document.getElementById('trackTitle');
        const btn = document.getElementById('startBtn');

        // --- LEJÁTSZÁSI LISTA ---
        // Ide másold a saját .mp3 linkjeidet!
        const playlist = [
            "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3",
            "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3",
            "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3"
        ];

        async function syncAndPlay() {
            title.innerText = "SZINKRONIZÁLÁS...";
            
            // 1. Lekérjük az indulási időt a Firebase-ből
            const snapshot = await db.ref('radioState/playlistStartedAt').get();
            const startTime = snapshot.val();
            
            const now = Date.now();
            let totalElapsedSeconds = (now - startTime) / 1000;

            // 2. Kiszámoljuk, melyik dal szól most
            findAndPlay(0, totalElapsedSeconds);
        }

        function findAndPlay(index, elapsed) {
            // Ha a lista végére értünk, újrakezdjük az elejéről (Loop)
            if (index >= playlist.length) {
                // Kiszámoljuk az összesített időt a ciklushoz, hogy ne legyen ugrás
                syncAndPlay(); 
                return;
            }

            let tempAudio = new Audio(playlist[index]);
            tempAudio.onloadedmetadata = () => {
                let duration = tempAudio.duration;

                if (elapsed < duration) {
                    // EZ A DAL SZÓL MOST
                    player.src = playlist[index];
                    player.currentTime = elapsed; // Oda ugrunk, ahol a világ tart
                    player.play().catch(e => {
                        title.innerText = "HIBA: KATTINTS A HALLGATÁSRA!";
                    });
                    
                    title.innerText = "MOST SZÓL: " + decodeURIComponent(playlist[index].split('/').pop());
                    
                    // Ha vége a dalnak, jön a következő szinkron
                    player.onended = () => {
                        syncAndPlay();
                    };
                } else {
                    // Ez a dal már lement, nézzük a következőt a listában
                    findAndPlay(index + 1, elapsed - duration);
                }
            };
            
            // Hibakezelés, ha nem tölthető be a fájl
            tempAudio.onerror = () => {
                console.error("Hiba a fájl betöltésekor: " + playlist[index]);
                findAndPlay(index + 1, elapsed);
            };
        }

        btn.onclick = () => {
            syncAndPlay();
            btn.innerText = "ÉLŐ ADÁS";
            btn.disabled = true;
        };

        // ADMIN FUNKCIÓ: Ha frissíteni akarod a kezdőidőt a mostani pillanatra
        window.resetTime = () => {
            const now = Date.now();
            db.ref('radioState').set({ playlistStartedAt: now });
            console.log("Idő szinkronizálva: " + now);
            alert("Rádió újraindítva a jelenlegi időponttól!");
            location.reload();
        };
    </script>
</body>
</html>
