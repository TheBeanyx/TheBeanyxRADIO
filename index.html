<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DöBéjnix Radio - Premium Edition</title>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #00f2ff;
            --secondary: #7000ff;
            --bg: #050505;
            --glass: rgba(255, 255, 255, 0.05);
        }

        body {
            margin: 0;
            background: var(--bg);
            color: white;
            font-family: 'Rajdhani', sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* Animált Háttér */
        .bg-animate {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 50%, #1a0033 0%, #050505 100%);
            z-index: -1;
        }
        .blob {
            position: absolute;
            width: 500px; height: 500px;
            background: var(--secondary);
            filter: blur(120px);
            border-radius: 50%;
            opacity: 0.2;
            animation: move 20s infinite alternate;
        }

        @keyframes move {
            from { transform: translate(-20%, -20%); }
            to { transform: translate(20%, 20%); }
        }

        /* Fő Konténer */
        .glass-card {
            background: var(--glass);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 30px;
            padding: 40px;
            width: 90%;
            max-width: 800px;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 5px;
            background: linear-gradient(to right, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 30px;
        }

        .time-display {
            font-size: 5rem;
            font-weight: 700;
            font-family: 'Orbitron', sans-serif;
            margin: 20px 0;
            text-shadow: 0 0 20px var(--primary);
        }

        /* Időjárás Grid */
        .weather-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 15px;
            margin: 30px 0;
        }
        .weather-item {
            background: rgba(255,255,255,0.03);
            padding: 15px;
            border-radius: 15px;
            border: 1px solid rgba(255,255,255,0.05);
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .weather-item span { display: block; font-size: 0.8rem; opacity: 0.6; }
        .weather-item b { font-size: 1.5rem; color: var(--primary); }

        .playing-bar {
            background: rgba(0,0,0,0.3);
            padding: 20px;
            border-radius: 20px;
            border-left: 5px solid var(--secondary);
            margin-top: 20px;
        }

        .btn-play {
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            border: none; color: white; padding: 20px 60px;
            border-radius: 50px; font-family: 'Orbitron', sans-serif;
            font-weight: bold; cursor: pointer; font-size: 1.2rem;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            transition: 0.3s;
        }
        .btn-play:hover { transform: scale(1.05); box-shadow: 0 0 30px var(--primary); }

        #aiStatus { color: #f2ff00; font-weight: bold; margin-top: 15px; height: 20px; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="bg-animate">
        <div class="blob"></div>
    </div>

    <div class="glass-card" id="mainUI">
        <h1>DÖBÉJNIX RADIO</h1>
        
        <div class="time-display" id="clock">00:00:00</div>
        <div id="dateDisplay">2024. MÁRCIUS 29.</div>

        <div class="weather-grid" id="weatherGrid">
            <div class="weather-item"><span>BUDAPEST</span><b id="w-bp">--°C</b></div>
            <div class="weather-item"><span>MISKOLC (É)</span><b id="w-miskolc">--°C</b></div>
            <div class="weather-item"><span>SZEGED (D)</span><b id="w-szeged">--°C</b></div>
            <div class="weather-item"><span>DEBRECEN (K)</span><b id="w-debrecen">--°C</b></div>
            <div class="weather-item"><span>PÉCS (NY)</span><b id="w-pecs">--°C</b></div>
        </div>

        <div class="playing-bar">
            <span style="font-size: 0.7rem; opacity: 0.5;">MOST SZÓL</span>
            <div id="trackTitle" style="font-size: 1.2rem; letter-spacing: 2px;">VÁRAKOZÁS AZ INDÍTÁSRA...</div>
        </div>

        <div id="aiStatus"></div>
        <br>
        <button id="startBtn" class="btn-play">HALLGATÁS INDÍTÁSA</button>
    </div>

    <audio id="audioPlayer"></audio>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBLZVnNY-HdYw7vpSfF6ewJHLru2l6e9WE",
            databaseURL: "https://thebeanyxradio-default-rtdb.europe-west1.firebasedatabase.app"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const playlist = [
            "Black Halo Protocol (1).mp3", "Black Halo Protocol (2).mp3",
            "Demon Season (1).mp3", "Demon Season.mp3",
            "Dust On The Sunday Sun (1).mp3", "Dust On The Sunday Sun.mp3",
            "Fractured Tongues, Broken Amps (1).mp3", "Fractured Tongues, Broken Amps.mp3",
            "Golden Afternoon Switch (1).mp3", "Golden Afternoon Switch.mp3",
            "Halfway To The Horizon (1).mp3", "Halfway To The Horizon.mp3",
            "Rise Like Thunder (1).mp3", "Rise Like Thunder.mp3",
            "Run The Gauntlet (1).mp3", "Run The Gauntlet.mp3",
            "Side of the Sun (1).mp3", "Side of the Sun.mp3",
            "Sun On My Sneakers (1).mp3", "Sun On My Sneakers.mp3",
            "Velvet Afterglow (1).mp3", "Velvet Afterglow.mp3"
        ];

        const announceTimes = ["07:00", "07:30", "08:00", "08:15", "08:30", "09:00", "09:30", "10:00", "10:15", "10:30", "11:00", "11:30", "12:00", "12:15", "12:30", "12:45", "13:00", "14:00", "15:00", "16:00", "16:30", "17:00", "17:30", "18:00", "19:00"];
        
        const audio = document.getElementById('audioPlayer');
        let temps = { bp: 0, miskolc: 0, szeged: 0, debrecen: 0, pecs: 0 };
        let isAI = false;
        let audioOk = false;

        // Óra és logikai vezérlés
        function update() {
            const now = new Date();
            const timeStr = now.toLocaleTimeString('hu-HU', {hour: '2-digit', minute: '2-digit'});
            const sec = now.getSeconds();
            
            document.getElementById('clock').innerText = now.toLocaleTimeString('hu-HU');
            document.getElementById('dateDisplay').innerText = now.toLocaleDateString('hu-HU', {year:'numeric', month:'long', day:'numeric'}).toUpperCase();

            // Bemondás csekkolás
            if (announceTimes.includes(timeStr) && sec === 0 && !isAI) {
                const hour = now.getHours();
                if (hour >= 7 && hour <= 19) {
                    playWeatherReport(timeStr);
                }
            }
        }
        setInterval(update, 1000);

        // Időjárás adatok frissítése
        async function fetchWeather() {
            const cities = [
                {k: 'bp', lat: 47.49, lon: 19.04},
                {k: 'miskolc', lat: 48.10, lon: 20.78},
                {k: 'szeged', lat: 46.25, lon: 20.14},
                {k: 'debrecen', lat: 47.53, lon: 21.62},
                {k: 'pecs', lat: 46.07, lon: 18.23}
            ];
            for (let c of cities) {
                try {
                    const r = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${c.lat}&longitude=${c.lon}&current_weather=true`);
                    const d = await r.json();
                    temps[c.k] = Math.round(d.current_weather.temperature);
                    const el = document.getElementById(`w-${c.k}`);
                    el.innerText = temps[c.k] + "°C";
                    el.parentElement.style.transform = "scale(1.1)";
                    setTimeout(() => el.parentElement.style.transform = "scale(1)", 500);
                } catch(e) {}
            }
        }
        fetchWeather();
        setInterval(fetchWeather, 600000);

        // Bemondás Funkció
        function playWeatherReport(idő) {
            isAI = true;
            document.getElementById('aiStatus').innerText = "MŰSORVEZETŐ ADÁSBAN...";
            audio.pause();

            const szöveg = `Üdvözlök mindenkit itt a DöBéjnix rádióban! ${idő} van, és egy kis időjárás jelentés következik. Az ország nyugati részén, Pécs környékén ${temps.pecs} fok, míg a keleti részén, Debrecenben szintén ${temps.debrecen} fok körüli hőmérsékletre számíthatnak. A déli részen, Szeged térségében ${temps.szeged} fokra számíthatnak. Az északi részeken, Miskolc környékén ${temps.miskolc} fok várható. A fővárosban pedig jelenleg ${temps.bp} fokot mérünk. További jó szórakozást mindenkinek!`;

            const synth = window.speechSynthesis;
            const utter = new SpeechSynthesisUtterance(szöveg);
            utter.lang = 'hu-HU';
            utter.rate = 0.95;
            
            utter.onend = () => {
                isAI = false;
                document.getElementById('aiStatus').innerText = "";
                syncRadio(); // Zene indítása a bemondás után
            };
            synth.speak(utter);
        }

        // Rádió Szinkronizálás
        async function syncRadio() {
            if (isAI || !audioOk) return;

            const snap = await db.ref('radioState').get();
            const data = snap.val();
            if(!data) return;

            const now = new Date();
            const hour = now.getHours();
            
            // Éjszakai mód (19:01 - 06:59): Csak zene, nincs AI
            const track = playlist[data.currentTrackIndex];
            const elapsed = (Date.now() - data.playlistStartedAt) / 1000;

            audio.src = encodeURIComponent(track);
            audio.onloadedmetadata = () => {
                if(elapsed < audio.duration) {
                    audio.currentTime = elapsed;
                    audio.play();
                    document.getElementById('trackTitle').innerText = track.replace('.mp3', '').toUpperCase();
                } else {
                    autoNext();
                }
            };
        }

        function autoNext() {
            db.ref('radioState/currentTrackIndex').get().then(s => {
                let next = (s.val() + 1) % playlist.length;
                db.ref('radioState').set({ currentTrackIndex: next, playlistStartedAt: Date.now() });
            });
        }

        db.ref('radioState').on('value', syncRadio);

        document.getElementById('startBtn').onclick = function() {
            audioOk = true;
            this.classList.add('hidden');
            syncRadio();
        };
    </script>
</body>
</html>
