<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <title>0-24 Autonóm Rádió</title>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <style>
        body { background: #121212; color: white; font-family: sans-serif; text-align: center; padding: 50px; }
        .player-card { background: #1e1e1e; padding: 30px; border-radius: 20px; display: inline-block; }
        button { padding: 15px 30px; background: #1db954; border: none; color: white; border-radius: 25px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <div class="player-card">
        <h1>Élő Adás</h1>
        <p id="trackTitle">Betöltés...</p>
        <button id="playBtn">Hallgatás</button>
    </div>

    <audio id="audioPlayer"></audio>

    <script>
        // A TE CONFIGOD
        const firebaseConfig = {
            apiKey: "AIzaSyBLZVnNY-HdYw7vpSfF6ewJHLru2l6e9WE",
            authDomain: "thebeanyxradio.firebaseapp.com",
            databaseURL: "https://thebeanyxradio-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "thebeanyxradio",
            storageBucket: "thebeanyxradio.firebasestorage.app",
            messagingSenderId: "492055957952",
            appId: "1:492055957952:web:5eece9153e7caf35df7825"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const player = document.getElementById('audioPlayer');
        const btn = document.getElementById('playBtn');
        const titleDisplay = document.getElementById('trackTitle');

        // IDE TEDD A ZENÉIDET (A sorrend fontos!)
        const playlist = [
            "https://valami.com/zene1.mp3",
            "https://valami.com/zene2.mp3"
        ];

        async function syncRadio() {
            // 1. Lekérjük az adatbázisból, mikor indult el a rádió örökre
            const snapshot = await db.ref('radioState/playlistStartedAt').get();
            const startTime = snapshot.val();
            
            const now = Date.now();
            let totalElapsed = (now - startTime) / 1000; // Eltelt másodpercek az indulás óta

            // 2. Kiszámoljuk a dalt (ez a rész megméri a dalt és ugrik)
            playAtCurrentTime(totalElapsed);
        }

        function playAtCurrentTime(totalElapsed) {
            let currentTrackIndex = 0;
            
            function tryNext(index, elapsed) {
                if (index >= playlist.length) {
                    // Ha a lista végére értünk, kezdjük elölről a ciklust
                    playAtCurrentTime(elapsed); 
                    return;
                }

                const tempAudio = new Audio(playlist[index]);
                tempAudio.onloadedmetadata = () => {
                    const duration = tempAudio.duration;
                    
                    if (elapsed < duration) {
                        // EZ A DAL SZÓL MOST!
                        player.src = playlist[index];
                        player.currentTime = elapsed;
                        player.play();
                        titleDisplay.innerText = "Most szól: " + playlist[index].split('/').pop();
                        
                        // Ha vége, jön a következő
                        player.onended = () => {
                            syncRadio();
                        };
                    } else {
                        // Már lement ez a dal, nézzük a következőt
                        tryNext(index + 1, elapsed - duration);
                    }
                };
            }
            
            tryNext(0, totalElapsed);
        }

        btn.addEventListener('click', () => {
            syncRadio();
            btn.style.display = 'none';
        });

        // ADMIN FUNKCIÓ: Ezt csak egyszer kell lefuttatnod a konzolban, 
        // hogy rögzítsd a "Világ kezdetét" a rádiónak.
        function resetRadioTime() {
            db.ref('radioState').set({
                playlistStartedAt: Date.now()
            });
        }
    </script>
</body>
</html>
