<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <title>TheBeanyx Radio - Live Control</title>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <style>
        body { background: #0a0a0a; color: #00ff00; font-family: 'Courier New', monospace; text-align: center; padding: 20px; }
        .container { max-width: 600px; margin: auto; border: 2px solid #00ff00; padding: 20px; background: #111; }
        h1 { text-shadow: 0 0 10px #00ff00; }
        #nowPlaying { font-size: 1.2em; color: white; margin: 20px 0; padding: 10px; border: 1px dashed #00ff00; }
        .playlist-container { text-align: left; margin-top: 20px; max-height: 300px; overflow-y: auto; border-top: 1px solid #00ff00; }
        .track-item { padding: 10px; cursor: pointer; border-bottom: 1px solid #222; transition: 0.2s; }
        .track-item:hover { background: #00ff00; color: #000; }
        .btn-main { background: #00ff00; color: #000; border: none; padding: 15px 30px; font-weight: bold; cursor: pointer; margin-bottom: 10px; }
    </style>
</head>
<body>

    <div class="container">
        <h1>THE BEANYX RADIO</h1>
        <div id="nowPlaying">VÁRAKOZÁS...</div>
        
        <button id="syncBtn" class="btn-main">BEKAPCSOLÓDÁS AZ ADÁSBA</button>

        <div class="playlist-container" id="playlistDisplay">
            </div>
    </div>

    <audio id="player"></audio>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBLZVnNY-HdYw7vpSfF6ewJHLru2l6e9WE",
            databaseURL: "https://thebeanyxradio-default-rtdb.europe-west1.firebasedatabase.app"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const playlist = [
            "Black Halo Protocol (1).mp3", "Black Halo Protocol (2).mp3",
            "Demon Season (1).mp3", "Demon Season.mp3",
            "Dust On The Sunday Sun (1).mp3", "Dust On The Sunday Sun.mp3",
            "Fractured Tongues, Broken Amps (1).mp3", "Fractured Tongues, Broken Amps.mp3",
            "Golden Afternoon Switch (1).mp3", "Golden Afternoon Switch.mp3",
            "Halfway To The Horizon (1).mp3", "Halfway To The Horizon.mp3",
            "Rise Like Thunder (1).mp3", "Rise Like Thunder.mp3",
            "Run The Gauntlet (1).mp3", "Run The Gauntlet.mp3",
            "Side of the Sun (1).mp3", "Side of the Sun.mp3",
            "Sun On My Sneakers (1).mp3", "Sun On My Sneakers.mp3",
            "Velvet Afterglow (1).mp3", "Velvet Afterglow.mp3"
        ];

        const player = document.getElementById('player');
        const titleDisp = document.getElementById('nowPlaying');
        const listDisp = document.getElementById('playlistDisplay');

        // 1. LISTA GENERÁLÁSA
        playlist.forEach((track, index) => {
            let div = document.createElement('div');
            div.className = 'track-item';
            div.innerText = (index + 1) + ". " + track;
            div.onclick = () => changeTrack(index);
            listDisp.appendChild(div);
        });

        // 2. DAL VÁLTÁSA (Ez frissíti a Firebase-t mindenkinél)
        function changeTrack(index) {
            db.ref('radioState').set({
                currentTrackIndex: index,
                playlistStartedAt: Date.now()
            });
        }

        // 3. FIGYELŐ (Amint változik a Firebase, ez lefut mindenkinél)
        db.ref('radioState').on('value', (snapshot) => {
            const data = snapshot.val();
            if (!data) return;

            const trackIndex = data.currentTrackIndex;
            const startTime = data.playlistStartedAt;
            const elapsed = (Date.now() - startTime) / 1000;

            const trackName = playlist[trackIndex];
            player.src = encodeURIComponent(trackName);
            
            player.onmetadata = () => {}; // Üres, de kell a stabilitáshoz
            
            player.onloadeddata = () => {
                if (elapsed < player.duration) {
                    player.currentTime = elapsed;
                    player.play().catch(e => console.log("Interakció kell a lejátszáshoz"));
                    titleDisp.innerText = "MOST SZÓL: " + trackName;
                }
            };
        });

        document.getElementById('syncBtn').onclick = () => {
            document.getElementById('syncBtn').style.display = 'none';
            // Itt csak manuálisan frissítünk egyet, a többit a '.on' figyeli
            player.play().catch(e => console.log("Lejátszás indítva"));
        };

        // Automatikus ugrás a következőre, ha vége a dalnak
        player.onended = () => {
            // Megkeressük a mostani indexet és váltunk a következőre
            db.ref('radioState/currentTrackIndex').get().then(snap => {
                let next = (snap.val() + 1) % playlist.length;
                changeTrack(next);
            });
        };
    </script>
</body>
</html>
